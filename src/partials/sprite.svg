<!--
  Shared SVG defs + the protagonist armchair as a <symbol>.
  The container is 0x0 + absolutely positioned (NOT display:none, which would
  stop gradients/symbols from rendering in some browsers).
  Colours come from CSS custom properties so every <use> can re-upholster the
  same chair: --seat (upholstery), --wood (frame), --wood-dark (legs/shade).
-->
<svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="g-plum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7442A3"/>
      <stop offset=".55" stop-color="#5B2A86"/>
      <stop offset="1" stop-color="#47206A"/>
    </linearGradient>
    <linearGradient id="g-wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A5A35"/>
      <stop offset=".6" stop-color="#6B4226"/>
      <stop offset="1" stop-color="#55331C"/>
    </linearGradient>
    <linearGradient id="g-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9C7" stop-opacity=".75"/>
      <stop offset="1" stop-color="#FFE9C7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="g-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFE3B3" stop-opacity=".9"/>
      <stop offset=".45" stop-color="#E9B97F" stop-opacity=".35"/>
      <stop offset="1" stop-color="#E9B97F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#B79AD6" stroke-width=".8" opacity=".55"/>
    </pattern>
    <pattern id="p-stripe" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(90)">
      <rect width="14" height="14" fill="#C8986A"/>
      <rect width="4" height="14" fill="#B58357"/>
    </pattern>

    <symbol id="i-phone" viewBox="0 0 24 24">
      <path fill="currentColor" d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/>
    </symbol>
    <!-- Two arrows instead of a CSS mirror: nothing to transform (rule 10). -->
    <symbol id="i-arrow-ltr" viewBox="0 0 24 24">
      <path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-arrow-rtl" viewBox="0 0 24 24">
      <path d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- The armchair: walnut frame + upholstered back, seat and arm pads. -->
    <symbol id="chair" viewBox="0 0 400 400">
      <ellipse cx="200" cy="360" rx="150" ry="10" fill="#141114" opacity=".16"/>
      <g style="fill:var(--wood-dark,#4A2C18)">
        <path d="M146 298H158L156 338H148Z"/>
        <path d="M242 298H254L252 338H244Z"/>
      </g>
      <g style="fill:var(--wood,#6B4226)">
        <path d="M104 106Q104 58 152 58H248Q296 58 296 106V220Q296 232 284 232H116Q104 232 104 220Z"/>
        <path d="M70 172Q70 150 92 150H96Q118 150 118 172V282H70Z"/>
        <path d="M282 172Q282 150 304 150H308Q330 150 330 172V282H282Z"/>
        <path d="M66 272H334V292Q334 298 328 298H72Q66 298 66 292Z"/>
        <path d="M92 298H110L96 358H86Z"/>
        <path d="M290 298H308L314 358H304Z"/>
      </g>
      <g style="fill:var(--seat,#5B2A86)">
        <path d="M122 110Q122 76 156 76H244Q278 76 278 110V210Q278 222 266 222H134Q122 222 122 210Z"/>
        <path d="M112 224Q112 206 130 206H270Q288 206 288 224V250Q288 262 276 262H124Q112 262 112 250Z"/>
        <path d="M64 168Q64 142 90 142H98Q124 142 124 168V186H64Z"/>
        <path d="M276 168Q276 142 302 142H310Q336 142 336 168V186H276Z"/>
      </g>
      <!-- light + shade overlays work with any upholstery colour -->
      <g fill="#fff" opacity=".14">
        <path d="M132 112Q132 86 158 86H242Q262 86 266 100Q232 92 160 100Q136 104 132 126Z"/>
        <path d="M124 214H276Q282 214 282 220H118Q118 214 124 214Z"/>
        <path d="M74 166Q76 150 92 150H98Q112 150 116 160Q100 154 80 164Z"/>
        <path d="M286 166Q288 150 304 150H310Q324 150 328 160Q312 154 292 164Z"/>
      </g>
      <g fill="#141114" opacity=".16">
        <path d="M122 196Q200 206 278 196V210Q278 222 266 222H134Q122 222 122 210Z"/>
        <path d="M112 244Q200 254 288 244V250Q288 262 276 262H124Q112 262 112 250Z"/>
      </g>
      <g fill="#141114" opacity=".22">
        <circle cx="165" cy="128" r="4"/><circle cx="200" cy="128" r="4"/><circle cx="235" cy="128" r="4"/>
        <circle cx="182" cy="168" r="4"/><circle cx="218" cy="168" r="4"/>
      </g>
      <g fill="#C8986A" opacity=".35">
        <path d="M110 120Q112 90 136 70L138 72Q116 92 114 122Z"/>
        <path d="M74 276H326V279H74Z"/>
      </g>
    </symbol>
  </defs>
</svg>
